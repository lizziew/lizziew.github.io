{{ define "main" }}
<div class="col-xs-12 col-sm-8 col-md-9 content-column">
    {{ partial "mobile_nav_toggle.html" . }}
    <div class="grid">
        {{ .Content }}
        {{ range .Pages }}
            <div class="content-column-content">
                <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
                {{ .Summary }}
            </div>
        {{ end }}
    </div>
</div>
{{ end }}
